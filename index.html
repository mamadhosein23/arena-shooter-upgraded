<div class="hud" data-theme="dark">
  <div class="hud-grid">

    <!-- بحران (Critical) -->
    <section class="hud-panel" data-status="critical" aria-labelledby="reactor-title">
      <!-- براکت‌های گوشه و خط پایه -->
      <span class="hud-bracket hud-bracket--tl"></span>
      <span class="hud-bracket hud-bracket--br"></span>
      <span class="hud-base-line"></span>
      <span class="hud-arrows"><span>&lt;&gt;</span></span>

      <!-- رادار -->
      <div class="hud-radar" role="img" aria-label="Reactor scanning visualization">
        <span class="hud-radar__ring"></span>
        <span class="hud-radar__ring hud-radar__ring--mid"></span>
        <span class="hud-radar__ring hud-radar__ring--inner"></span>
        <span class="hud-radar__sweep"></span>
        <span class="hud-radar__core"></span>
      </div>

      <!-- متن وضعیت -->
      <p class="hud-kicker hud-kicker--blink">◈ Critical · Reactor 01</p>
      <!-- عنوان اصلی -->
      <h2 class="hud-title" id="reactor-title">Core temperature</h2>
      <!-- توضیح مختصر -->
      <p class="hud-copy">Temperature approaching the safety threshold.</p>

      <!-- نوار پیشرفت -->
      <progress class="hud-progress" value="82" max="100"
                aria-label="Core temperature: 82 percent">82%</progress>

      <!-- دکمه عمل -->
      <button class="hud-button" type="button">View telemetry</button>
    </section>

    <!-- فعال (Active) -->
    <section class="hud-panel" data-status="active" aria-labelledby="network-title">
      <span class="hud-bracket hud-bracket--tl"></span>
      <span class="hud-bracket hud-bracket--br"></span>
      <span class="hud-base-line"></span>
      <span class="hud-arrows"><span>&lt;&gt;</span></span>

      <div class="hud-radar" role="img" aria-label="Node scanning visualization">
        <span class="hud-radar__ring"></span>
        <span class="hud-radar__ring hud-radar__ring--mid"></span>
        <span class="hud-radar__ring hud-radar__ring--inner"></span>
        <span class="hud-radar__sweep"></span>
        <span class="hud-radar__core"></span>
      </div>

      <p class="hud-kicker">◉ Active · Node 02</p>
      <h2 class="hud-title" id="network-title">Quantum Link</h2>
      <p class="hud-copy">Data routing stable across primary subnets.</p>

      <progress class="hud-progress" value="45" max="100"
                aria-label="Quantum link load: 45 percent">45%</progress>

      <button class="hud-button" type="button">Configure node</button>
    </section>

    <!-- موفق (Success) -->
    <section class="hud-panel" data-status="success" aria-labelledby="shield-title">
      <span class="hud-bracket hud-bracket--tl"></span>
      <span class="hud-bracket hud-bracket--br"></span>
      <span class="hud-base-line"></span>
      <span class="hud-arrows"><span>&lt;&gt;</span></span>

      <div class="hud-radar" role="img" aria-label="Defense scanning visualization">
        <span class="hud-radar__ring"></span>
        <span class="hud-radar__ring hud-radar__ring--mid"></span>
        <span class="hud-radar__ring hud-radar__ring--inner"></span>
        <span class="hud-radar__sweep"></span>
        <span class="hud-radar__core"></span>
      </div>

      <p class="hud-kicker">✦ Secure · Grid Alpha</p>
      <h2 class="hud-title" id="shield-title">Defense Matrix</h2>
      <p class="hud-copy">All perimeter firewalls at peak efficiency.</p>

      <progress class="hud-progress" value="100" max="100"
                aria-label="Defense integrity: 100 percent">100%</progress>

      <button class="hud-button" type="button">Run diagnostics</button>
    </section>

  </div>
</div>

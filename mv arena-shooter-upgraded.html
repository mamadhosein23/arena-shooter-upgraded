<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" 
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYBER SURVIVOR: PROTOCOL ESCAPE</title>
  <style>
    :root{
      --bg:#02040a;
      --panel: rgba(10, 18, 40, .72);
      --panelBorder: rgba(0,255,204,.18);
      --cyan:#00ffcc;
      --cyan2:#00ffff;
      --danger:#ff3366;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --shadow: rgba(0,0,0,.55);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      overflow:hidden;
      background: radial-gradient(1200px 800px at 50% 30%, #07112a 0%, var(--bg) 55%, #000 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial;
      color:var(--text);
    }
    canvas{ display:block; width:100vw; height:100vh; }

    /* HUD */
    .hud{
      position:fixed;
      inset:16px 16px auto 16px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      pointer-events:none;
      z-index:10;
    }
    .panel{
      background: var(--panel);
      border: 1px solid var(--panelBorder);
      box-shadow: 0 12px 40px var(--shadow);
      backdrop-filter: blur(8px);
      border-radius:14px;
      padding:12px 14px;
      min-width: 220px;
    }
    .panel h3{
      margin:0 0 10px 0;
      font-size:12px;
      letter-spacing:.12em;
      color:var(--muted);
      font-weight:700;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size:13px;
    }
    .bar{
      height:10px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.06);
    }
    .bar > i{
      display:block;
      height:100%;
      width:50%;
      background: linear-gradient(90deg, var(--cyan), var(--cyan2));
      box-shadow: 0 0 18px rgba(0,255,204,.35);
    }
    .bar.dash > i{
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      box-shadow: 0 0 18px rgba(167,139,250,.25);
    }
    .stats{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width: 240px;
    }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .muted{ color:var(--muted); }

    /* Overlay */
    #overlay-screen{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(900px 600px at 50% 35%, rgba(0,255,204,.10) 0%, rgba(0,0,0,.78) 65%, rgba(0,0,0,.92) 100%);
      z-index:20;
    }
    .overlay-card{
      width:min(680px, calc(100vw - 28px));
      border-radius:18px;
      border:1px solid rgba(0,255,204,.25);
      background: rgba(2, 6, 20, .78);
      box-shadow: 0 18px 70px rgba(0,0,0,.65);
      padding:22px 22px 18px;
      text-align:center;
    }
    .title{
      margin:0 0 10px;
      font-size:24px;
      letter-spacing:.06em;
      color: var(--cyan);
      text-shadow: 0 0 22px rgba(0,255,204,.20);
    }
    .desc{
      margin:0 0 18px;
      color: var(--muted);
      line-height:1.7;
      font-size:14px;
    }
    .kbd{
      display:inline-flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      margin:10px 0 18px;
      color: var(--text);
      font-size:13px;
    }
    .kbd span{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      border-radius:10px;
      padding:6px 10px;
    }
    button{
      pointer-events:auto;
      border:1px solid rgba(0,255,204,.30);
      background: linear-gradient(180deg, rgba(0,255,204,.22), rgba(0,255,204,.10));
      color: var(--text);
      padding:10px 16px;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      letter-spacing:.04em;
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
    }
    button:hover{ border-color: rgba(0,255,204,.55); }
    .small{
      margin-top:10px;
      font-size:12px;
      color: rgba(148,163,184,.9);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="panel stats">
      <h3 class="mono">SYSTEM STATUS</h3>

      <div class="row">
        <div class="mono muted">HP</div>
        <div class="mono" id="hpText">150/150</div>
      </div>
      <div class="bar"><i id="hpBar" style="width:100%"></i></div>

      <div style="height:8px"></div>

      <div class="row">
        <div class="mono muted">DASH</div>
        <div class="mono muted">SPACE</div>
      </div>
      <div class="bar dash"><i id="dashBar" style="width:100%"></i></div>
    </div>

    <div class="panel stats">
      <h3 class="mono">MISSION</h3>
      <div class="row"><div class="mono muted">HOSTILES</div><div class="mono" id="enemiesText">HOSTILES: 0</div></div>
      <div class="row"><div class="mono muted">SCORE</div><div class="mono" id="scoreText">SCORE: 0</div></div>
      <div class="row"><div class="mono muted">STAGE</div><div class="mono" id="stageText">STAGE: 1</div></div>
    </div>
  </div>

  <div id="overlay-screen">
    <div class="overlay-card">
      <h1 class="title mono" id="overlay-title">CYBER SURVIVOR</h1>
      <p class="desc" id="overlay-desc">
        از درگاه خروج (دایره‌ی درخشان) فرار کن. دشمن‌ها دنبال تو هستن.
      </p>
      <div class="kbd mono">
        <span>WASD / Arrow Keys</span>
        <span>Mouse: Aim</span>
        <span>Click: Fire</span>
        <span>Space: Dash</span>
      </div>
      <button id="actionBtn">شروع</button>
      <div class="small mono">Tip: بهترین تجربه روی Chrome/Edge دسکتاپ</div>
    </div>
  </div>

   <script>
  'use strict';

  /* ================= AUDIO ENGINE ================= */
  class SoundEngine {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
    play(type) {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'fire') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.05);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'dash') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'warp') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      }
    }
  }
  const audio = new SoundEngine();

  /* ================= SETUP & CANVAS ================= */
  const $ = (id) => document.getElementById(id);
  const canvas = $('gameCanvas');
  const ctx = canvas.getContext('2d');
  let dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ================= STATE ================= */
  const TILE = 64;
  let COLS = 26, ROWS = 26;
  let grid = [];
  let stage = 1;
  let score = 0;
  let isRunning = false;
  let isTransitioning = false;
  let rafId = null;
  let screenShake = 0;
  let lastTime = performance.now();

  const camera = { x: 0, y: 0, shakeX: 0, shakeY: 0 };
  const keys = Object.create(null);
  const mouse = { x: 0, y: 0, isDown: false };

  const player = {
    x: 0, y: 0,
    radius: 18,
    speed: 260,
    hp: 150, maxHp: 150,
    angle: 0,
    lastDash: 0,
    dashCooldown: 900,
    isDashing: false,
    dashUntil: 0,
    lastShot: 0,
    fireRate: 130
  };

  let bullets = [];
  let enemies = [];
  let particles = [];
  const exitGate = { x: 0, y: 0, radius: 36 };

  /* ================= MAP GENERATION ================= */
  function isPathAvailable(startC, startR, targetC, targetR) {
    const visited = new Uint8Array(COLS * ROWS);
    const q = [startC | (startR << 16)];
    visited[startR * COLS + startC] = 1;
    const dirs = [[1,0], [-1,0], [0,1], [0,-1]];

    while (q.length) {
      const cur = q.shift();
      const c = cur & 0xFFFF;
      const r = cur >> 16;
      if (c === targetC && r === targetR) return true;

      for (let i = 0; i < 4; i++) {
        const nc = c + dirs[i][0];
        const nr = r + dirs[i][1];
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
        const idx = nr * COLS + nc;
        if (visited[idx] || grid[nr][nc] === 1) continue;
        visited[idx] = 1;
        q.push(nc | (nr << 16));
      }
    }
    return false;
  }

  function initStage(nextStage) {
    stage = nextStage;
    isTransitioning = false;
    COLS = Math.min(48, 22 + stage * 2);
    ROWS = Math.min(48, 22 + stage * 2);

    let pathExists = false;
    for (let tries = 0; tries < 50 && !pathExists; tries++) {
      grid = Array.from({ length: ROWS }, () => new Uint8Array(COLS));
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
            grid[r][c] = 1;
          } else if (Math.random() < 0.13) {
            grid[r][c] = 1;
          }
        }
      }

      for (let r = 1; r <= 3; r++)
        for (let c = 1; c <= 3; c++)
          grid[r][c] = 0;

      const exitR = ROWS - 3, exitC = COLS - 3;
      for (let r = exitR - 1; r <= exitR + 1; r++)
        for (let c = exitC - 1; c <= exitC + 1; c++)
          grid[r][c] = 0;

      pathExists = isPathAvailable(2, 2, exitC, exitR);
    }

    player.x = 2.5 * TILE;
    player.y = 2.5 * TILE;
    player.hp = player.maxHp;

    exitGate.x = (COLS - 2.5) * TILE;
    exitGate.y = (ROWS - 2.5) * TILE;

    bullets.length = 0;
    enemies.length = 0;
    particles.length = 0;

    const count = 4 + Math.floor(stage * 1.6);
    for (let i = 0; i < count; i++) spawnEnemy();
    $('stageText').innerText = `STAGE: ${stage}`;
  }

  function spawnEnemy() {
    const types = ['crawler', 'brute', 'specter'];
    const type = types[(Math.random() * types.length) | 0];
    let hp = 35 + stage * 12, speed = 125 + stage * 5, radius = 16, color = '#ff3b6b';

    if (type === 'brute') {
      hp = 90 + stage * 30; speed = 75 + stage * 3; radius = 22; color = '#ff9900';
    } else if (type === 'specter') {
      hp = 25 + stage * 8; speed = 210 + stage * 8; radius = 13; color = '#c026d3';
    }

    for (let tries = 0; tries < 100; tries++) {
      const c = 2 + Math.floor(Math.random() * (COLS - 4));
      const r = 2 + Math.floor(Math.random() * (ROWS - 4));
      if (grid[r][c] !== 0) continue;

      const ex = (c + 0.5) * TILE;
      const ey = (r + 0.5) * TILE;
      if (Math.hypot(ex - player.x, ey - player.y) < 360) continue;

      enemies.push({ x: ex, y: ey, type, hp, maxHp: hp, speed, radius, color, angle: 0 });
      return;
    }
  }

  /* ================= COLLISION SYSTEM ================= */
  function circleWallCollide(x, y, r) {
    const minC = Math.max(0, Math.floor((x - r) / TILE));
    const maxC = Math.min(COLS - 1, Math.floor((x + r) / TILE));
    const minR = Math.max(0, Math.floor((y - r) / TILE));
    const maxR = Math.min(ROWS - 1, Math.floor((y + r) / TILE));

    for (let row = minR; row <= maxR; row++) {
      for (let col = minC; col <= maxC; col++) {
        if (grid[row][col] !== 1) continue;
        const nearX = Math.max(col * TILE, Math.min(x, (col + 1) * TILE));
        const nearY = Math.max(row * TILE, Math.min(y, (row + 1) * TILE));
        const dx = x - nearX;
        const dy = y - nearY;
        if (dx * dx + dy * dy < r * r) return true;
      }
    }
    return false;
  }

  function resolveMovement(entity, vx, vy, dt) {
    const nextX = entity.x + vx * dt;
    if (!circleWallCollide(nextX, entity.y, entity.radius)) {
      entity.x = nextX;
    }
    const nextY = entity.y + vy * dt;
    if (!circleWallCollide(entity.x, nextY, entity.radius)) {
      entity.y = nextY;
    }
  }

  function addSparks(x, y, color, count = 6) {
    if (particles.length > 250) return; // GC Cap
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 180 + 40;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1.0,
        decay: Math.random() * 2.5 + 1.8,
        color
      });
    }
  }

  /* ================= CORE LOOP ================= */
  function update(dt, now) {
    if (!isRunning) return;

    // Viewport to World Raycast
    const worldMouseX = mouse.x + camera.x - camera.shakeX;
    const worldMouseY = mouse.y + camera.y - camera.shakeY;
    player.angle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);

    // Dashing
    if (player.isDashing && now > player.dashUntil) player.isDashing = false;

    // Movement Normalization
    let mx = 0, my = 0;
    if (keys.KeyW || keys.ArrowUp) my -= 1;
    if (keys.KeyS || keys.ArrowDown) my += 1;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;
    if (keys.KeyD || keys.ArrowRight) mx += 1;

    if (mx !== 0 || my !== 0) {
      const len = Math.hypot(mx, my);
      const moveSpd = player.isDashing ? player.speed * 2.3 : player.speed;
      resolveMovement(player, (mx / len) * moveSpd, (my / len) * moveSpd, dt);
    }

    // Weapons
    if (mouse.isDown && now - player.lastShot > player.fireRate) {
      player.lastShot = now;
      const muzzleX = player.x + Math.cos(player.angle) * 18;
      const muzzleY = player.y + Math.sin(player.angle) * 18;
      const bSpeed = 820;
      bullets.push({
        x: muzzleX,
        y: muzzleY,
        vx: Math.cos(player.angle) * bSpeed,
        vy: Math.sin(player.angle) * bSpeed,
        life: 0.75
      });
      screenShake = Math.max(screenShake, 3.2);
      audio.play('fire');
    }

    // Bullets processing
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      if (b.life <= 0 || circleWallCollide(b.x, b.y, 2.5)) {
        addSparks(b.x, b.y, '#00ffff', 3);
        bullets.splice(i, 1);
        continue;
      }

      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 4) {
          e.hp -= 28;
          addSparks(b.x, b.y, '#00ffff', 4);
          bullets.splice(i, 1);
          audio.play('hit');

          if (e.hp <= 0) {
            addSparks(e.x, e.y, e.color, 12);
            enemies.splice(j, 1);
            score += 100 * stage;
            screenShake = Math.max(screenShake, 4.5);
          }
          break;
        }
      }
    }

    // Enemies Processing (Vector follow + Sliding Wall Collision)
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      e.angle = Math.atan2(dy, dx);

      if (dist > 1) {
        resolveMovement(e, (dx / dist) * e.speed, (dy / dist) * e.speed, dt);
      }

      if (dist < e.radius + player.radius) {
        player.hp -= 32 * dt;
        screenShake = Math.max(screenShake, 5.0);
        if (player.hp <= 0) {
          player.hp = 0;
          handleGameOver();
          return;
        }
      }
    }

    // Warp Check
    if (!isTransitioning && Math.hypot(player.x - exitGate.x, player.y - exitGate.y) < exitGate.radius) {
      isTransitioning = true;
      score += 400 * stage;
      audio.play('warp');
      initStage(stage + 1);
    }

    // Particles Processing
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Camera Interpolation & Screen Shake
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;
    camera.x += (player.x - viewW / 2 - camera.x) * (7 * dt);
    camera.y += (player.y - viewH / 2 - camera.y) * (7 * dt);

    if (screenShake > 0) {
      camera.shakeX = (Math.random() - 0.5) * screenShake * 2;
      camera.shakeY = (Math.random() - 0.5) * screenShake * 2;
      screenShake = Math.max(0, screenShake - 12 * dt);
    } else {
      camera.shakeX = 0;
      camera.shakeY = 0;
    }

    // UI Updates
    $('hpBar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    $('hpText').innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
    const dashRatio = Math.min(1, (now - player.lastDash) / player.dashCooldown);
    $('dashBar').style.width = `${dashRatio * 100}%`;
    $('enemiesText').innerText = `HOSTILES: ${enemies.length}`;
    $('scoreText').innerText = `SCORE: ${score}`;
  }

  function draw() {
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;
    ctx.clearRect(0, 0, viewW, viewH);

    ctx.save();
    ctx.translate(-Math.floor(camera.x + camera.shakeX), -Math.floor(camera.y + camera.shakeY));

    // Frustum Culling Tiles
    const startCol = Math.max(0, Math.floor((camera.x) / TILE));
    const endCol = Math.min(COLS - 1, Math.ceil((camera.x + viewW) / TILE));
    const startRow = Math.max(0, Math.floor((camera.y) / TILE));
    const endRow = Math.min(ROWS - 1, Math.ceil((camera.y + viewH) / TILE));

    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        const px = c * TILE, py = r * TILE;
        if (grid[r][c] === 1) {
          ctx.fillStyle = '#0b1329';
          ctx.fillRect(px, py, TILE, TILE);
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 1;
          ctx.strokeRect(px, py, TILE, TILE);
        } else {
          ctx.fillStyle = '#04070e';
          ctx.fillRect(px, py, TILE, TILE);
        }
      }
    }

    // Gate
    ctx.save();
    ctx.translate(exitGate.x, exitGate.y);
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, exitGate.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.rotate(performance.now() * 0.0018);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.strokeRect(-14, -14, 28, 28);
    ctx.restore();

    // Bullets
    ctx.fillStyle = '#00ffff';
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Entities
    for (let i = 0; i < enemies.length; i++) drawEnemyMesh(enemies[i]);
    drawPlayerMesh(player);

    // Particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 2.5, 2.5);
    }
    ctx.globalAlpha = 1.0;

    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.06);
    lastTime = now;
    update(dt, now);
    draw();
    if (isRunning) rafId = requestAnimationFrame(loop);
  }

  /* ================= VISUALS ================= */
  function drawPlayerMesh(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(-12, -12);
    ctx.lineTo(12, -7);
    ctx.lineTo(12, 7);
    ctx.lineTo(-12, 12);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawEnemyMesh(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);

    if (e.type === 'crawler') {
      ctx.fillStyle = '#1a0508';
      ctx.beginPath();
      ctx.moveTo(-10, -10);
      ctx.lineTo(13, 0);
      ctx.lineTo(-10, 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if (e.type === 'brute') {
      ctx.fillStyle = '#261205';
      ctx.fillRect(-12, -12, 24, 24);
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-12, -12, 24, 24);
    } else {
      ctx.fillStyle = 'rgba(192, 38, 211, 0.35)';
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();

    if (e.hp < e.maxHp) {
      const w = e.radius * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, w, 4);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, Math.max(0, (e.hp / e.maxHp) * w), 4);
    }
  }

  /* ================= STATE HANDLING ================= */
  function handleGameOver() {
    isRunning = false;
    $('overlay-title').innerText = 'MISSION TERMINATED';
    $('overlay-title').style.color = '#ff3366';
    $('overlay-desc').innerText = `FINAL SCORE: ${score}`;
    $('actionBtn').innerText = 'تلاش مجدد';
    $('overlay-screen').style.display = 'flex';
  }

  /* ================= INPUT LISTENER ================= */
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space' && isRunning) {
      const now = performance.now();
      if (now - player.lastDash > player.dashCooldown) {
        player.lastDash = now;
        player.isDashing = true;
        player.dashUntil = now + 150;
        audio.play('dash');
        addSparks(player.x, player.y, '#00ffff', 12);
      }
    }
  });

  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mousedown', (e) => { if (e.button === 0) mouse.isDown = true; });
  window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.isDown = false; });
  window.addEventListener('blur', () => {
    mouse.isDown = false;
    for (const key in keys) keys[key] = false;
  });

  $('actionBtn').addEventListener('click', () => {
    audio.init();
    $('overlay-screen').style.display = 'none';
    score = 0;
    initStage(1);
    isRunning = true;
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER SURVIVOR // OVERDRIVE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #030712;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
      color: #f8fafc;
      cursor: crosshair;
    }
    canvas { display: block; }

    /* صفحه شروع سینماتیک */
    #startScreen, #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(3, 7, 18, 0.98) 100%);
      backdrop-filter: blur(8px);
      z-index: 50;
      gap: 16px;
    }
    .glitch-title {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(56, 189, 248, 0.4);
    }
    .info-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 18px 26px;
      line-height: 1.8;
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .info-box b { color: #f1f5f9; }
    
    .cyber-btn {
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #030712;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .cyber-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 45px rgba(6, 182, 212, 0.8);
      background: linear-gradient(135deg, #38bdf8, #60a5fa);
    }

    /* HUD مینیمال نئونی */
    #hud {
      position: fixed;
      top: 20px;
      right: 24px;
      text-align: right;
      font-size: 15px;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .neon-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 14px;
      border-radius: 9999px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      gap: 8px;
      align-items: center;
      width: fit-content;
      margin-left: auto;
    }
    .neon-pill span {
      color: #38bdf8;
      font-weight: 800;
      font-family: monospace;
      font-size: 16px;
    }

    #bottomHud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      pointer-events: none;
      z-index: 10;
    }
    .bar-container {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 10px;
      min-width: 180px;
      backdrop-filter: blur(4px);
    }
    .bar-track {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .bar-core {
      height: 100%;
      width: 100%;
      border-radius: 4px;
      transition: width 0.12s ease-out;
    }
    #hpCore { background: linear-gradient(90deg, #f43f5e, #fb7185); box-shadow: 0 0 12px #f43f5e; }
    #dashCore { background: linear-gradient(90deg, #0ea5e9, #38bdf8); box-shadow: 0 0 12px #0ea5e9; }

    #overlay.hidden { display: none; }
  </style>
</head>
<body>

  <div id="startScreen">
    <div class="glitch-title">CYBER SURVIVOR</div>
    <div class="info-box">
      حرکت: <b>W A S D</b><br>
      شلیک: <b>کلیک چپ / نگه داشتن ماوس</b><br>
      دش سریع (آسیب‌ناپذیر): <b>Space</b><br>
      تعویض اسلحه: <b>1 (Blaster) | 2 (Scatter) | 3 (Viper)</b>
    </div>
    <button class="cyber-btn" id="startBtn">شروع ماموریت</button>
  </div>

  <div id="hud">
    <div class="neon-pill">امتیاز: <span id="hudScore">0</span></div>
    <div class="neon-pill">موج: <span id="hudWave">1</span></div>
    <div class="neon-pill">سلاح: <span id="hudWeapon">Blaster</span></div>
  </div>

  <div id="bottomHud">
    <div class="bar-container">
      <div style="font-size: 11px; letter-spacing: 1px; color: #94a3b8;">SHIELD INTEGRITY</div>
      <div class="bar-track"><div id="hpCore" class="bar-core"></div></div>
    </div>
    <div class="bar-container">
      <div style="font-size: 11px; letter-spacing: 1px; color: #94a3b8;">WARP DASH (SPACE)</div>
      <div class="bar-track"><div id="dashCore" class="bar-core"></div></div>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div class="glitch-title" style="color: #ef4444; text-shadow: 0 0 30px rgba(239, 68, 68, 0.8);">ارتباط قطع شد</div>
    <p id="ovScore" style="color: #94a3b8; font-size: 17px; margin-bottom: 10px;">امتیاز نهایی: 0</p>
    <button class="cyber-btn" id="restartBtn">احیای مجدد سیستم</button>
  </div>

  <canvas id="game"></canvas>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- صدای پروسیجرال پیشرفته (Sound Engine) ---
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}

function playSynth(type) {
  if (!actx) return;
  const now = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.connect(gain);
  gain.connect(actx.destination);

  if (type === "laser") {
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.09);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
    osc.start(now);
    osc.stop(now + 0.09);
  } else if (type === "heavy") {
    osc.type = "square";
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.14);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
    osc.start(now);
    osc.stop(now + 0.14);
  } else if (type === "boom") {
    osc.type = "triangle";
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(25, now + 0.28);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.28);
    osc.start(now);
    osc.stop(now + 0.28);
  } else if (type === "warp") {
    osc.type = "sine";
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(750, now + 0.14);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
    osc.start(now);
    osc.stop(now + 0.14);
  } else if (type === "heal") {
    osc.type = "sine";
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.linearRampToValueAtTime(650, now + 0.18);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.18);
    osc.start(now);
    osc.stop(now + 0.18);
  }
}

// ابعاد بوم
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ورودی‌ها
const keys = {};
const mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Digit1") currentWeaponIdx = 0;
  if (e.code === "Digit2") currentWeaponIdx = 1;
  if (e.code === "Digit3") currentWeaponIdx = 2;
  if (e.code === "Space") performDash();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener("mousedown", e => { if (e.button === 0) mouse.down = true; });
window.addEventListener("mouseup", e => { if (e.button === 0) mouse.down = false; });

// بالانس سلاح‌ها (قوی‌تر و لذت‌بخش‌تر)
const weapons = [
  { name: "Blaster", rate: 130, speed: 20, count: 1, spread: 0, damage: 38, color: "#38bdf8", recoil: 2.5, sound: "laser" },
  { name: "Scatter", rate: 450, speed: 17, count: 7, spread: 0.26, damage: 24, color: "#fbbf24", recoil: 6.5, sound: "heavy" },
  { name: "Viper",   rate: 80,  speed: 23, count: 1, spread: 0.04, damage: 18, color: "#a855f7", recoil: 1.8, sound: "laser" }
];
let currentWeaponIdx = 0;
let lastShotTime = 0;

// سیستم و متغیرهای بازی
let isRunning = false;
let score = 0;
let wave = 1;
let screenShake = 0;
let lastFrameTime = performance.now();

const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 17,
  speed: 5.6, // حرکت چابک‌تر
  hp: 120,
  maxHp: 120,
  angle: 0,
  recoilOffset: 0,
  muzzleFlash: 0,
  dashCooldown: 850, // شارژ سریع‌تر دش
  lastDash: 0,
  isDashing: false,
  dashDuration: 140,
  dashEndTime: 0,
  dashVx: 0,
  dashVy: 0,
  ghosts: [] // رد نئونی دش
};

let bullets = [];
let enemies = [];
let particles = [];
let shockwaves = [];
let pickups = [];

function resetGame() {
  score = 0;
  wave = 1;
  currentWeaponIdx = 0;
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.hp = player.maxHp;
  player.isDashing = false;
  player.lastDash = 0;
  player.ghosts = [];
  player.recoilOffset = 0;
  player.muzzleFlash = 0;
  bullets = [];
  enemies = [];
  particles = [];
  shockwaves = [];
  pickups = [];
  screenShake = 0;
  document.getElementById("overlay").classList.add("hidden");
  updateUI();
}

function performDash() {
  const now = performance.now();
  if (now - player.lastDash < player.dashCooldown || player.isDashing) return;

  let mx = 0, my = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) my -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) my += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;

  if (mx === 0 && my === 0) {
    mx = Math.cos(player.angle);
    my = Math.sin(player.angle);
  } else {
    const len = Math.hypot(mx, my);
    mx /= len;
    my /= len;
  }

  player.isDashing = true;
  player.lastDash = now;
  player.dashEndTime = now + player.dashDuration;
  player.dashVx = mx * 20;
  player.dashVy = my * 20;

  playSynth("warp");
  shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 70, color: "#38bdf8", alpha: 0.8 });
}

function shoot() {
  const now = performance.now();
  const wep = weapons[currentWeaponIdx];
  if (now - lastShotTime < wep.rate) return;

  lastShotTime = now;
  playSynth(wep.sound);

  screenShake = Math.max(screenShake, wep.recoil);
  player.recoilOffset = 6;
  player.muzzleFlash = 0.8;

  for (let i = 0; i < wep.count; i++) {
    const spread = player.angle + (Math.random() - 0.5) * wep.spread;
    bullets.push({
      x: player.x + Math.cos(player.angle) * 22,
      y: player.y + Math.sin(player.angle) * 22,
      vx: Math.cos(spread) * wep.speed,
      vy: Math.sin(spread) * wep.speed,
      damage: wep.damage,
      color: wep.color,
      radius: 4,
      life: 1.2
    });
  }
}

// تولید معقول و حساب‌شده دشمنان
function spawnEnemy() {
  const maxEnemies = 7 + wave * 3; // جمعیت کنترل‌شده‌تر
  if (enemies.length >= maxEnemies) return;

  const edge = Math.floor(Math.random() * 4);
  let x, y;
  const padding = 70; // فاصله بیشتر از لبه صفحه
  if (edge === 0) { x = Math.random() * canvas.width; y = -padding; }
  else if (edge === 1) { x = canvas.width + padding; y = Math.random() * canvas.height; }
  else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + padding; }
  else { x = -padding; y = Math.random() * canvas.height; }

  const types = [
    { type: "runner", hp: 35 + wave * 4, speed: 2.1, radius: 15, color: "#f43f5e", score: 10 },
    { type: "stalker", hp: 20 + wave * 3, speed: 2.9, radius: 12, color: "#facc15", score: 15 },
    { type: "brute", hp: 110 + wave * 15, speed: 1.1, radius: 24, color: "#c084fc", score: 30 }
  ];

  const roll = Math.random();
  const cfg = roll < 0.65 ? types[0] : roll < 0.88 ? types[1] : types[2];

  enemies.push({
    x, y,
    hp: cfg.hp,
    maxHp: cfg.hp,
    speed: cfg.speed,
    radius: cfg.radius,
    color: cfg.color,
    score: cfg.score
  });
}

function spawnExplosion(x, y, color) {
  shockwaves.push({ x, y, radius: 8, maxRadius: 50, color, alpha: 0.9 });
  for (let i = 0; i < 18; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 6 + 2;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      radius: Math.random() * 3 + 1.5,
      color,
      life: 0.6 + Math.random() * 0.3,
      maxLife: 0.9
    });
  }
}

function update(dt) {
  const now = performance.now();

  // 1. جابجایی پلیر
  if (player.isDashing) {
    player.x += player.dashVx;
    player.y += player.dashVy;
    // تولید افکت شبح دش
    player.ghosts.push({ x: player.x, y: player.y, angle: player.angle, alpha: 0.5 });
    if (now >= player.dashEndTime) player.isDashing = false;
  } else {
    let mx = 0, my = 0;
    if (keys["KeyW"] || keys["ArrowUp"]) my -= 1;
    if (keys["KeyS"] || keys["ArrowDown"]) my += 1;
    if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
    if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;

    if (mx !== 0 && my !== 0) {
      mx *= 0.7071;
      my *= 0.7071;
    }
    player.x += mx * player.speed;
    player.y += my * player.speed;
  }

  // محدودیت به ابعاد صفحه
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  if (player.recoilOffset > 0) player.recoilOffset *= 0.85;
  if (player.muzzleFlash > 0) player.muzzleFlash -= dt * 6;

  // آپدیت اشباح دش
  for (let i = player.ghosts.length - 1; i >= 0; i--) {
    player.ghosts[i].alpha -= dt * 3.5;
    if (player.ghosts[i].alpha <= 0) player.ghosts.splice(i, 1);
  }

  // شلیک ممتد
  if (mouse.down) shoot();

  // 2. تیرها
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
      bullets.splice(i, 1);
    }
  }

  // 3. دشمن‌ها
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    const dx = player.x - en.x;
    const dy = player.y - en.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 1) {
      en.x += (dx / dist) * en.speed;
      en.y += (dy / dist) * en.speed;
    }

    // برخورد با پلیر (حین دش ایمن هستی!)
    if (dist < player.radius + en.radius) {
      if (!player.isDashing) {
        player.hp -= 18 * dt; // کاهش صدمه تماسی
        screenShake = 5;
        if (player.hp <= 0) {
          player.hp = 0;
          gameOver();
          return;
        }
      }
    }

    // برخورد تیر به دشمن
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - en.x, b.y - en.y) < en.radius + b.radius) {
        en.hp -= b.damage;
        bullets.splice(j, 1);

        // ذرات اثر ضربه
        for (let k = 0; k < 3; k++) {
          particles.push({
            x: b.x, y: b.y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            radius: 2,
            color: b.color,
            life: 0.2,
            maxLife: 0.2
          });
        }

        if (en.hp <= 0) {
          spawnExplosion(en.x, en.y, en.color);
          playSynth("boom");
          score += en.score;

          // شانس بالای ۲۵٪ دراپ برای تنفس بازیکن
          if (Math.random() < 0.25) {
            pickups.push({ x: en.x, y: en.y, radius: 9, pulse: 0 });
          }

          enemies.splice(i, 1);
          break;
        }
      }
    }
  }

  // 4. آیتم‌ها
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.pulse += dt * 5;
    if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius + 6) {
      player.hp = Math.min(player.maxHp, player.hp + 35);
      playSynth("heal");
      shockwaves.push({ x: player.x, y: player.y, radius: 5, maxRadius: 40, color: "#10b981", alpha: 0.8 });
      pickups.splice(i, 1);
    }
  }

  // 5. ذرات و شوک‌ویوها
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.radius += (sw.maxRadius - sw.radius) * 0.15;
    sw.alpha -= dt * 2;
    if (sw.alpha <= 0) shockwaves.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.92;
    pt.vy *= 0.92;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  if (Math.random() < 0.028) spawnEnemy();
  wave = 1 + Math.floor(score / 350);

  screenShake *= 0.88;
  if (screenShake < 0.05) screenShake = 0;

  updateUI();
}

function updateUI() {
  document.getElementById("hudScore").textContent = score;
  document.getElementById("hudWave").textContent = wave;
  document.getElementById("hudWeapon").textContent = weapons[currentWeaponIdx].name;
  document.getElementById("hpCore").style.width = Math.max(0, (player.hp / player.maxHp * 100)) + "%";

  const dashElapsed = performance.now() - player.lastDash;
  const dashRatio = Math.min(1, dashElapsed / player.dashCooldown);
  document.getElementById("dashCore").style.width = (dashRatio * 100) + "%";
}

function gameOver() {
  isRunning = false;
  document.getElementById("ovScore").textContent = `امتیاز ثبت‌شده: ${score}`;
  document.getElementById("overlay").classList.remove("hidden");
}

// --- رندر گرافیکی سینماتیک ---
function draw() {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Screen shake
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake * 3, (Math.random() - 0.5) * screenShake * 3);
  }

  // پس‌زمینه نئونی با شبکه و Vignette
  ctx.strokeStyle = "rgba(30, 41, 59, 0.4)";
  ctx.lineWidth = 1;
  const gridSize = 50;
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // سوئیچ به حالت نورانی (Additive Blending برای افکت Glow)
  ctx.globalCompositeOperation = "lighter";

  // Shockwaves
  for (const sw of shockwaves) {
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 3;
    ctx.globalAlpha = Math.max(0, sw.alpha);
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // اشباح دش
  for (const g of player.ghosts) {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.angle);
    ctx.fillStyle = "rgba(56, 189, 248, " + g.alpha + ")";
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // آیتم‌های لوت (پالس دار نئونی)
  for (const p of pickups) {
    const glow = Math.sin(p.pulse) * 3 + 10;
    ctx.fillStyle = "#10b981";
    ctx.shadowColor = "#10b981";
    ctx.shadowBlur = glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ذرات
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // گلوله‌ها با افکت Glow
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1.0;

  // بازگشت به حالت ترکیب رنگ معمولی برای اشیاء صلب
  ctx.globalCompositeOperation = "source-over";

  // دشمن‌ها
  for (const en of enemies) {
    ctx.save();
    ctx.translate(en.x, en.y);

    // بدنه دشمن
    ctx.fillStyle = en.color;
    ctx.beginPath();
    ctx.arc(0, 0, en.radius, 0, Math.PI * 2);
    ctx.fill();

    // هسته مرکزی
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(0, 0, en.radius * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // نوار جان مینیاتوری
    if (en.hp < en.maxHp) {
      const bw = en.radius * 2;
      ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
      ctx.fillRect(-en.radius, -en.radius - 8, bw, 3);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(-en.radius, -en.radius - 8, bw * (en.hp / en.maxHp), 3);
    }
    ctx.restore();
  }

  // رسم بازیکن
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  // لوله سلاح و لگد
  ctx.fillStyle = "#475569";
  ctx.fillRect(10 - player.recoilOffset, -3.5, 14, 7);

  // فلش شلیک لوله (Muzzle Flash)
  if (player.muzzleFlash > 0) {
    ctx.fillStyle = "rgba(255, 255, 255, " + player.muzzleFlash + ")";
    ctx.beginPath();
    ctx.arc(26, 0, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  // بدنه اصلی بازیکن
  ctx.fillStyle = player.isDashing ? "#38bdf8" : "#f8fafc";
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();

  // هسته درونی
  ctx.fillStyle = "#0284c7";
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
  ctx.restore();
}

function gameLoop(time) {
  if (!isRunning) return;
  const dt = Math.min((time - lastFrameTime) / 1000, 0.1);
  lastFrameTime = time;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// لیسنرها
document.getElementById("startBtn").addEventListener("click", () => {
  initAudio();
  document.getElementById("startScreen").style.display = "none";
  resize();
  resetGame();
  isRunning = true;
  lastFrameTime = performance.now();
  requestAnimationFrame(gameLoop);
});

document.getElementById("restartBtn").addEventListener("click", () => {
  initAudio();
  resetGame();
  isRunning = true;
  lastFrameTime = performance.now();
  requestAnimationFrame(gameLoop);
});
</script>
